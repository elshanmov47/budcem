<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<title>Büdcəm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone-width column, sticky month bar on top, tab bar fixed at the bottom, add button floating above it */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --fg: #16201d;
  --muted: #5f6c68;
  --line: #dde3e1;
  --accent: #0f766e;
  --accent-fg: #ffffff;
  --income: #15803d;
  --expense: #b42318;
  --need: #2563eb;
  --want: #db2777;
  --invest: #16a34a;
  --credit: #ea580c;
  --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 4px 16px rgba(16, 40, 34, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
    --accent: #2dd4bf; --accent-fg: #062b27; --income: #4ade80; --expense: #f87171;
    --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
  --accent: #2dd4bf; --accent-fg: #062b27; --income: #4ade80; --expense: #f87171;
  --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
:root[data-mode="light"] {
  --bg: #f3f5f4; --surface: #ffffff; --surface-2: #e8edeb; --fg: #16201d; --muted: #5f6c68; --line: #dde3e1;
  --accent: #0f766e; --accent-fg: #ffffff; --income: #15803d; --expense: #b42318;
  --need: #2563eb; --want: #db2777; --invest: #16a34a; --credit: #ea580c;
  --shadow: 0 1px 2px rgba(16, 40, 34, .06), 0 4px 16px rgba(16, 40, 34, .06); color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #0d1412; --surface: #16201d; --surface-2: #1f2b28; --fg: #e8efec; --muted: #94a39e; --line: #263431;
  --accent: #2dd4bf; --accent-fg: #062b27; --income: #4ade80; --expense: #f87171;
  --need: #60a5fa; --want: #f472b6; --invest: #4ade80; --credit: #fb923c;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 12px 10px;
}
.title-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
.title-wrap h1 { overflow: hidden; text-overflow: ellipsis; }
.switch { flex: none; position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; padding: 0; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch svg { position: absolute; width: 12px; height: 12px; top: 7px; right: 6px; color: var(--muted); }
.switch[aria-checked="true"] svg { left: 6px; right: auto; color: var(--accent-fg); }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
.modes { display: grid; gap: 8px; }
.mode { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 500; text-align: left; }
.mode svg { width: 22px; height: 22px; color: var(--accent); }
.mode span { flex: 1; }
.mode[aria-pressed="true"] { border-color: var(--accent); border-width: 2px; padding: 13px; }
.mode .check { visibility: hidden; }
.mode[aria-pressed="true"] .check { visibility: visible; }
.topbar h1 { white-space: nowrap; font-family: var(--font-display); font-size: clamp(18px, 5.6vw, 28px); font-weight: 700; letter-spacing: -.02em; margin: 0; }
.month { flex: none; display: flex; align-items: center; gap: 2px; background: var(--surface); border-radius: 999px; padding: 3px; box-shadow: var(--shadow); }
.month .mlabel { min-width: 76px; text-align: center; font-weight: 600; font-size: 15px; border: 0; background: transparent; padding: 6px 4px; border-radius: 999px; }
.month .mlabel:active { background: var(--surface-2); }
.cal-year { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.cal-year b { font-size: 20px; }
.cal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cal-m { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 4px 10px; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cal-m i { width: 6px; height: 6px; border-radius: 3px; background: transparent; }
.cal-m.has i { background: var(--accent); }
.cal-m.today { border-color: var(--accent); }
.cal-m[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.cal-head { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.cal-head b { font-size: 18px; border: 0; background: transparent; }
.cal-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .04em; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-d { border: 0; background: var(--surface); border-radius: 10px; min-height: 52px; padding: 6px 1px 5px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; min-width: 0; }
.cal-d b { font-size: 15px; font-weight: 600; }
.cal-d small { font-size: 10px; line-height: 1.1; color: var(--expense); font-weight: 600; white-space: nowrap; overflow: hidden; max-width: 100%; }
.cal-d.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal-d.spent { background: color-mix(in srgb, var(--expense) 8%, var(--surface)); }
.cal-d:disabled { visibility: hidden; }
.cal-sum { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding-inline: 4px; }
.cal-sum b { color: var(--expense); }
.cal-m.has[aria-pressed="true"] i { background: var(--accent-fg); }
.icon-btn { width: 34px; height: 34px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center; color: var(--accent); }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }

.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }

.balance .big { font-family: var(--font-display); font-size: 36px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 14px; }
.balance .big.neg { color: var(--expense); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.split div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.split small { display: block; color: var(--muted); font-size: 13px; }
.split b { font-size: 18px; }
.split .in b { color: var(--income); }
.split .out b { color: var(--expense); }

.donut-row { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
@media (max-width: 360px) { .donut-row { grid-template-columns: 1fr; justify-items: center; } }
.donut { width: 132px; height: 132px; }
.donut text { fill: var(--fg); }
.legend { display: flex; flex-direction: column; gap: 10px; min-width: 0; width: 100%; }
.legend-item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 3px; }
.legend-item .pct { color: var(--muted); font-size: 13px; margin-left: 4px; }

.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; }
.bar-row .name { font-size: 15px; min-width: 0; }
.track { height: 5px; background: var(--surface-2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

.badge { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.day { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 70px); }
.day h3 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); margin: 6px 4px 8px; }
.list { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; width: 100%; border: 0; background: transparent; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row:active { background: var(--surface-2); }
.row .t { min-width: 0; }
.row .t div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { font-size: 13px; color: var(--muted); }
.row .amt { font-weight: 600; }
.row .amt.in { color: var(--income); }
.chev { color: var(--muted); }

.empty { text-align: center; color: var(--muted); padding: 40px 16px; }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

.fab {
  position: fixed; z-index: 21; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
  bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom, 0px));
  width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(15, 118, 110, .35);
}
.fab svg { width: 26px; height: 26px; }
@media (min-width: 600px) { .fab { right: calc(50% - 280px + 18px); } }

.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .38); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 8px 12px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.link { border: 0; background: transparent; color: var(--accent); font-size: 16px; padding: 6px 0; justify-self: start; }
.link.save { justify-self: end; font-weight: 600; }
.link:disabled { color: var(--muted); opacity: .5; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.amount-wrap { display: flex; align-items: baseline; gap: 6px; background: var(--surface); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--line); }
.amount-wrap input { border: 0; background: transparent; font-family: var(--font-display); font-size: 36px; font-weight: 700; width: 100%; min-width: 0; outline: none; }
.amount-wrap em { font-style: normal; font-size: 26px; font-weight: 600; color: var(--muted); }

.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type { border: 2px solid transparent; border-radius: 14px; padding: 12px; text-align: left; background: var(--surface); display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.type .dot { width: 12px; height: 12px; border-radius: 4px; }
.type[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--surface)); }

.danger { border: 0; width: 100%; background: var(--surface); color: var(--expense); border-radius: 12px; padding: 13px; font-weight: 600; }
.danger.confirm { background: var(--expense); color: #fff; }
.primary { border: 0; width: 100%; background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 13px; font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 90px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); }
.picker .chev { transition: transform .15s; font-size: 20px; line-height: 1; }
.picker[aria-expanded="true"] .chev { transform: rotate(90deg); }
.picker .placeholder { color: var(--muted); }
.picklist { margin-top: 6px; max-height: 320px; overflow-y: auto; }
.picklist .row[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.check { color: var(--accent); font-weight: 700; }
.card-toggle { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; }
.card-toggle .label { margin: 0; }
.card-toggle .chev { color: var(--muted); font-size: 20px; transition: transform .15s; }
.card-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.card-toggle + .bars, .card-toggle + .empty { margin-top: 14px; }
.months .row .t div:first-child { font-weight: 600; }
.months .row[aria-current="true"] { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
.bal-neg { color: var(--expense); }
.alert { display: flex; gap: 12px; align-items: center; background: color-mix(in srgb, var(--credit) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--credit) 40%, transparent); border-radius: 14px; padding: 12px 14px; width: 100%; text-align: left; }
.alert svg { width: 22px; height: 22px; color: var(--credit); flex: none; }
.alert b { display: block; font-size: 15px; }
.alert span { font-size: 13px; color: var(--muted); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.card-head .label { margin: 0; }
.small-link { border: 0; background: transparent; color: var(--accent); font-size: 14px; font-weight: 600; padding: 4px 0; }
.rem-list { display: flex; flex-direction: column; }
.rem { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border: 0; background: transparent; text-align: left; width: 100%; }
.rem + .rem { border-top: 1px solid var(--line); }
.rem .day-badge { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.rem .sub { font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.done { background: color-mix(in srgb, var(--income) 15%, transparent); color: var(--income); }
.pill.late { background: color-mix(in srgb, var(--expense) 15%, transparent); color: var(--expense); }
.pill.today { background: color-mix(in srgb, var(--credit) 18%, transparent); color: var(--credit); }
.pill.soon { background: var(--surface-2); color: var(--muted); }
.rem.is-done .t div:first-child { text-decoration: line-through; color: var(--muted); }
.cal-d { position: relative; }
.cal-d.has-rem::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 3px; background: var(--credit); }
.secondary { border: 1px solid var(--line); width: 100%; background: var(--surface); color: var(--fg); border-radius: 12px; padding: 13px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; min-width: 0; }
.tile .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.tile .ic svg { width: 19px; height: 19px; }
.tile.warn .ic { background: color-mix(in srgb, var(--credit) 16%, transparent); color: var(--credit); }
.tile b { display: block; font-size: 15px; font-weight: 600; }
.tile span.s { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.warn span.s { color: var(--credit); font-weight: 600; }
.tile > div { min-width: 0; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); -webkit-overflow-scrolling: touch; }
.tbl { border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 100%; }
.tbl th, .tbl td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface); }
.tbl th:first-child, .tbl td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; border-right: 1px solid var(--line); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.tbl td.z { color: var(--muted); opacity: .6; }
.tbl tr.total td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
.tbl tr.total td:first-child { background: var(--surface-2); }
.tbl td.neg { color: var(--expense); }
.tbl td.pos { color: var(--income); }
.plan-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.plan-top button, .plan-top div { border: 0; background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: left; min-width: 0; }
.plan-top small { display: block; font-size: 12px; color: var(--muted); }
.plan-top b { font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 4px; background: var(--accent); max-width: 100%; }
.prog.over i { background: var(--expense); }
.plan-big { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 14px 0 8px; flex-wrap: wrap; }
.plan-big b { font-size: 22px; font-family: var(--font-display); }
.plan-big span { color: var(--muted); font-size: 14px; }
.plan-row { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; padding: 11px 0; border: 0; background: transparent; width: 100%; text-align: left; }
.plan-row + .plan-row { border-top: 1px solid var(--line); }
.plan-row .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.plan-row .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-row .top span:last-child { font-size: 14px; white-space: nowrap; }
.plan-row .msg { font-size: 12px; color: var(--muted); margin-top: 4px; }
.plan-row .msg.over { color: var(--expense); font-weight: 600; }
.plan-row .muted { color: var(--muted); }
.type-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; }
.type-ic i { width: 12px; height: 12px; border-radius: 4px; }
.note { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 8px; }
</style>

  <header class="topbar">
    <div class="title-wrap">
      <h1 id="title">Xülasə</h1>
      <button class="switch" id="themeBtn" role="switch" aria-checked="false" aria-label="Tünd rejim"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <div class="month" id="monthBox">
      <button class="icon-btn" id="prevM" aria-label="Əvvəlki ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="monthLabel" class="mlabel num" aria-label="Ay seçin"></button>
      <button class="icon-btn" id="nextM" aria-label="Növbəti ay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </header>
  <main id="view" class="stack"></main>

<button class="fab" id="fab" aria-label="Yeni əməliyyat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="tabbar">
  <nav>
    <button data-tab="summary" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Xülasə</button>
    <button data-tab="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Əməliyyatlar</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Plan</button>
    <button data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Kateqoriyalar</button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
  // ---------- Sabitlər ----------
  const TYPES = [
    { id: "need", title: "Ehtiyac", color: "var(--need)" },
    { id: "want", title: "İstək", color: "var(--want)" },
    { id: "investment", title: "İnvestisiya", color: "var(--invest)" },
    { id: "credit", title: "Kredit", color: "var(--credit)" }
  ];
  const TYPE = Object.fromEntries(TYPES.map(t => [t.id, t]));
  const DEFAULT_CATS = [
    ...["Qida", "Restoran", "Nəqliyyat", "Yanacaq", "Kommunal", "İcarə", "Ev təmiri", "Maşın təmiri", "Maşın sığortası",
        "Sənədləşmə", "Səhiyyə", "Təhsil", "Geyim", "Rabitə və internet", "Əyləncə", "Hədiyyə", "Digər"]
      .map((name, i) => ({ id: "e" + i, name, kind: "expense" })),
    ...["Maaş", "Bonus", "Əlavə iş", "İnvestisiya gəliri", "Digər"]
      .map((name, i) => ({ id: "i" + i, name, kind: "income" }))
  ];
  // Köhnə versiyanın standart xatırladıcıları: dəyişdirilməyiblərsə silinir, siyahı boş başlayır
  const OLD_DEFAULT_REMINDERS = { "r-ipoteka": "İpoteka", "r-kommunal": "Kommunal", "r-ata-internet": "Ata internet", "r-ev-internet": "Ev internet" };
  const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  const WEEKDAYS = ["Bazar", "Bazar ertəsi", "Çərşənbə axşamı", "Çərşənbə", "Cümə axşamı", "Cümə", "Şənbə"];
  const PALETTE = ["#0f766e", "#2563eb", "#7c3aed", "#db2777", "#ea580c", "#ca8a04", "#16a34a", "#0891b2", "#9333ea", "#be123c"];

  // ---------- Köməkçilər ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = v => {
    const neg = v < 0; v = Math.abs(v);
    const fixed = (Math.round(v * 100) / 100).toFixed(2);
    let [int, dec] = fixed.split(".");
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + int + (dec === "00" ? "" : "," + dec) + " ₼";
  };
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  const dayTitle = s => { const d = parseYmd(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}, ${WEEKDAYS[d.getDay()]}`; };
  const hue = name => { let h = 0; for (const c of name) h = (h * 31 + c.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  const badge = name => `<span class="badge" style="background:${hue(name)}">${esc((name || "?").trim().charAt(0).toLocaleUpperCase("az"))}</span>`;
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

  // ---------- Vəziyyət ----------
  const state = {
    tab: "summary",
    month: new Date(),
    filter: "all",
    catKind: "expense",
    catsOpen: false,
    categories: [],
    records: [],
    reminders: [],
    done: {},
    plan: { income: 0, types: {}, cats: {} },
    planShowAll: false,
    ready: false
  };
  const catById = id => state.categories.find(c => c.id === id);
  const normPlan = p => ({ income: Number(p?.income) || 0, types: { ...(p?.types || {}) }, cats: { ...(p?.cats || {}) } });

  // ---------- Saxlama ----------
  // claude.ai daxilində: hər istifadəçinin şəxsi verilənlər bazası (cihazlar arasında sinxron).
  // Ayrıca PWA kimi yerləşdiriləndə: brauzerin yaddaşı (localStorage).
  const LS_KEY = "budcem.v1";
  const store = {
    mode: "local",
    async init() {
      let db = null, user = null, id = null;
      if (window.claude && typeof window.claude.use === "function") {
        try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
        if (db && user) { try { id = await user.id(); } catch (e) {} }
      }
      if (db && id) return this.initDb(db, id);
      this.initLocal();
    },
    initLocal() {
      this.mode = "local";
      let data = null;
      try { data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
      state.categories = data?.categories || DEFAULT_CATS.slice();
      state.records = data?.records || [];
      state.reminders = data?.reminders || [];
      state.done = data?.done || {};
      state.plan = normPlan(data?.plan);
      state.ready = true;
      const migrated = this.dropOldDefaults();
      if (!data || migrated) this.persistLocal();
      render();
    },
    persistLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ categories: state.categories, records: state.records, reminders: state.reminders, done: state.done, plan: state.plan })); }
      catch (e) { toast("Yadda saxlamaq alınmadı: brauzer yaddaşı əlçatan deyil."); }
    },
    initDb(db, id) {
      this.mode = "db";
      this.base = db.doc(`data/users/${id}/budget`);
      this.recs = this.base.collection("records");
      let gotCats = false, gotRecs = false;
      const done = () => { if (gotCats && gotRecs && !state.ready) { state.ready = true; } render(); };
      this.base.onSnapshot(s => {
        if (s.exists) {
          const d = s.data();
          state.categories = d.categories || [];
          state.reminders = d.reminders || [];
          state.done = d.done || {};
          state.plan = normPlan(d.plan);
          gotCats = true;
          if (!s.metadata.fromCache && !this.migrated) { this.migrated = true; if (this.dropOldDefaults()) this.saveMeta(); }
          done();
        }
        else if (!s.metadata.fromCache) {
          state.categories = DEFAULT_CATS.slice(); state.reminders = []; state.done = {};
          this.migrated = true;
          gotCats = true; done();
          this.saveMeta();
        }
      }, () => this.fail());
      this.recs.onSnapshot(q => {
        state.records = q.docs.map(d => ({ ...d.data(), id: d.id }));
        gotRecs = true; done();
      }, () => this.fail());
    },
    fail() { toast("Məlumat bazası ilə əlaqə kəsildi. Səhifəni yeniləyin."); },
    async saveRecord(r) {
      const i = state.records.findIndex(x => x.id === r.id);
      if (i >= 0) state.records[i] = r; else state.records.push(r);
      render();
      if (this.mode === "local") return this.persistLocal();
      const { id, ...body } = r;
      try { await this.recs.doc(id).set(body); } catch (e) { toast(e?.code === "quota_exceeded" ? "Yaddaş limiti dolub." : "Yadda saxlamaq alınmadı. Yenidən cəhd edin."); }
    },
    async deleteRecord(id) {
      state.records = state.records.filter(r => r.id !== id);
      render();
      if (this.mode === "local") return this.persistLocal();
      try { await this.recs.doc(id).delete(); } catch (e) { toast("Silmək alınmadı."); }
    },
    dropOldDefaults() {
      const keep = state.reminders.filter(r => OLD_DEFAULT_REMINDERS[r.id] !== r.title);
      const changed = keep.length !== state.reminders.length;
      state.reminders = keep;
      return changed;
    },
    // Kateqoriyalar, xatırladıcılar və "ödənildi" qeydləri bir sənəddə saxlanılır
    async saveMeta() {
      render();
      if (this.mode === "local") return this.persistLocal();
      try { await this.base.set({ categories: state.categories, reminders: state.reminders, done: state.done, plan: state.plan }); }
      catch (e) { toast("Yadda saxlamaq alınmadı. Yenidən cəhd edin."); }
    },
    saveCategories(cats) { state.categories = cats; return this.saveMeta(); },
    saveReminders(list) { state.reminders = list; return this.saveMeta(); },
    setDone(key, value) {
      const d = { ...state.done };
      if (value) d[key] = true; else delete d[key];
      state.done = d;
      return this.saveMeta();
    }
  };

  // ---------- Hesablamalar ----------
  const monthRecords = () => { const k = monthKey(state.month); return state.records.filter(r => r.date && r.date.startsWith(k)); };
  const sum = list => list.reduce((a, r) => a + (Number(r.amount) || 0), 0);

  // ---------- Ekranlar ----------
  function render() {
    $("#monthLabel").textContent = `${MON_SHORT[state.month.getMonth()]} ${state.month.getFullYear()}`;
    $("#monthLabel").setAttribute("aria-label", `${MONTHS[state.month.getMonth()]} ${state.month.getFullYear()}, ay seçin`);
    $("#title").textContent = { summary: "Xülasə", records: "Əməliyyatlar", plan: "Plan", cats: "Kateqoriyalar" }[state.tab];
    $("#monthBox").hidden = state.tab === "cats";
    document.querySelectorAll(".tabbar button").forEach(b => {
      if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    const view = $("#view");
    if (!state.ready) { view.innerHTML = `<div class="empty"><b>Yüklənir…</b>Xərc və gəlirləriniz açılır.</div>`; return; }
    view.innerHTML = state.tab === "summary" ? summaryView() : state.tab === "records" ? recordsView() : state.tab === "plan" ? planView() : catsView();
  }

  // ---------- Xatırladıcılar ----------
  const daysLabel = days => "Hər ay: " + days.slice().sort((a, b) => a - b).join(", ");
  // Seçilmiş ay üçün ödənişlər: hər xatırladıcı ayda bir ödənişdir, amma bir neçə gün xatırladıla bilər (məs. 1-i və 5-i)
  function occurrences(year, month) {
    const last = new Date(year, month + 1, 0).getDate();
    const today = ymd(new Date());
    const ym = `${year}-${pad(month + 1)}`;
    const list = [];
    state.reminders.forEach(r => {
      const dates = [...new Set((r.days || []).map(d => `${ym}-${pad(Math.min(d, last))}`))].sort();
      if (!dates.length) return;
      const key = `${r.id}|${ym}`;
      const done = !!state.done[key] || dates.some(d => state.done[`${r.id}|${d}`]);
      const next = dates.find(d => d >= today);
      const status = done ? "done" : dates.includes(today) ? "today" : !next ? "late" : "soon";
      list.push({ r, dates, date: next || dates[dates.length - 1], key, done, status });
    });
    return list.sort((a, b) => a.date.localeCompare(b.date) || a.r.title.localeCompare(b.r.title));
  }
  const daysOf = o => o.dates.map(d => Number(d.slice(8))).join(" və ");
  function statusPill(o) {
    if (o.status === "done") return `<span class="pill done">Ödənildi ✓</span>`;
    if (o.status === "late") return `<span class="pill late">Gecikib</span>`;
    if (o.status === "today") return `<span class="pill today">Bu gün</span>`;
    const days = Math.round((parseYmd(o.date) - parseYmd(ymd(new Date()))) / 86400000);
    return `<span class="pill soon">${days} gün qalıb</span>`;
  }
  // Xülasədə iki kiçik düymə: xatırladıcılar və hesabat
  function toolTiles() {
    const now = new Date();
    const due = occurrences(now.getFullYear(), now.getMonth()).filter(o => o.status === "today" || o.status === "late");
    const sub = due.length ? `${due.length} ödəniş gözləyir` : state.reminders.length ? "Gözləyən ödəniş yoxdur" : "Əlavə edin";
    return `<div class="tiles">
      <button class="tile ${due.length ? "warn" : ""}" data-openrem>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
        <div><b>Ödənişlər</b><span class="s">${sub}</span></div>
      </button>
      <button class="tile" data-report>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg></span>
        <div><b>Hesabat</b><span class="s">Aylar və maddələr</span></div>
      </button>
    </div>`;
  }

  function openRemindersSheet() {
    const draw = () => {
      const y = state.month.getFullYear(), m = state.month.getMonth();
      const list = occurrences(y, m);
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Bağla</button>
          <h2>Ödənişlər · ${MONTHS[m]}</h2>
          <button class="link save" data-managerem>Düzəlt</button>
        </div>
        <div class="stack">
          ${list.length ? `<div class="card" style="padding-block:6px"><div class="rem-list">${list.map(o => `
            <button class="rem ${o.done ? "is-done" : ""}" data-occ="${esc(o.key)}">
              <span class="day-badge num" style="${o.dates.length > 1 ? "font-size:12px" : ""}">${o.dates.map(d => Number(d.slice(8))).join("·")}</span>
              <span class="t"><div>${esc(o.r.title)}</div><div class="sub">${o.dates.length > 1 ? "Xatırlatma: " + daysOf(o) + " · " : ""}${o.r.amount ? money(o.r.amount) + " · " : ""}${TYPE[o.r.type]?.title || ""}</div></span>
              ${statusPill(o)}
            </button>`).join("")}</div></div>`
          : `<div class="empty"><b>Xatırladıcı yoxdur</b>"Düzəlt" ilə aylıq ödəniş əlavə edin.</div>`}
          <p class="note">Ödənişə toxunsanız, onu xərc kimi yaza və ya ödənildi kimi qeyd edə bilərsiniz.</p>
        </div>`);
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.occ) openOccurrenceSheet(t.dataset.occ);
      else if (t.hasAttribute("data-managerem")) openRemindersManager();
    };
    draw();
  }

  // ---------- Hesabat ----------
  const MON_SHORT = ["Yan", "Fev", "Mar", "Apr", "May", "İyn", "İyl", "Avq", "Sen", "Okt", "Noy", "Dek"];
  const r2 = v => Math.round(v * 100) / 100;
  const cell = v => {
    if (!v) return `<td class="z">–</td>`;
    const t = (Math.round(Math.abs(v) * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(".", ",").replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return `<td>${v < 0 ? "−" : ""}${t}</td>`;
  };
  function reportData(year) {
    const recs = state.records.filter(r => r.date && r.date.startsWith(year + "-"));
    const months = MONTHS.map((name, i) => ({ name, inc: 0, out: 0, need: 0, want: 0, investment: 0, credit: 0 }));
    const cats = {}, incCats = {};
    recs.forEach(r => {
      const m = Number(r.date.slice(5, 7)) - 1, a = Number(r.amount) || 0;
      const name = catById(r.catId)?.name || "Kateqoriyasız";
      if (r.kind === "income") {
        months[m].inc += a;
        (incCats[name] ||= Array(12).fill(0))[m] += a;
      } else {
        months[m].out += a;
        if (months[m][r.type] !== undefined) months[m][r.type] += a;
        (cats[name] ||= Array(12).fill(0))[m] += a;
      }
    });
    const rows = obj => Object.entries(obj).map(([name, arr]) => ({ name, arr, total: arr.reduce((x, y) => x + y, 0) })).sort((a, b) => b.total - a.total);
    return { recs, months, cats: rows(cats), incCats: rows(incCats) };
  }

  function openReport() {
    let year = state.month.getFullYear(), view = "months";
    const chevL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    const chevR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    const pivot = (rows, label) => {
      const totals = Array(12).fill(0);
      rows.forEach(r => r.arr.forEach((v, i) => totals[i] += v));
      return `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>${label}</th>${MON_SHORT.map(m => `<th>${m}</th>`).join("")}<th>Cəmi</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.name)}</td>${r.arr.map(cell).join("")}${cell(r.total)}</tr>`).join("")}
        <tr class="total"><td>Cəmi</td>${totals.map(cell).join("")}${cell(totals.reduce((a, b) => a + b, 0))}</tr></tbody>
      </table></div>`;
    };
    const draw = () => {
      const d = reportData(year);
      let body;
      if (view === "months") {
        const t = d.months.reduce((a, m) => { for (const k of ["inc", "out", "need", "want", "investment", "credit"]) a[k] += m[k]; return a; }, { inc: 0, out: 0, need: 0, want: 0, investment: 0, credit: 0 });
        const row = (name, m, cls = "") => {
          const bal = m.inc - m.out;
          return `<tr class="${cls}"><td>${name}</td>${cell(m.inc)}${cell(m.out)}<td class="${bal < 0 ? "neg" : bal > 0 ? "pos" : "z"}">${bal ? cell(bal).replace(/<\/?td[^>]*>/g, "") : "–"}</td>${cell(m.need)}${cell(m.want)}${cell(m.investment)}${cell(m.credit)}</tr>`;
        };
        body = `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Ay</th><th>Gəlir</th><th>Xərc</th><th>Qalıq</th><th>Ehtiyac</th><th>İstək</th><th>İnvest.</th><th>Kredit</th></tr></thead>
          <tbody>${d.months.map(m => row(m.name, m)).join("")}${row("Cəmi", t, "total")}</tbody>
        </table></div>`;
      } else if (view === "cats") {
        body = d.cats.length ? pivot(d.cats, "Xərc maddəsi") : `<div class="empty"><b>${year} ilində xərc yoxdur</b></div>`;
      } else {
        body = d.incCats.length ? pivot(d.incCats, "Gəlir mənbəyi") : `<div class="empty"><b>${year} ilində gəlir yoxdur</b></div>`;
      }
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Bağla</button>
          <h2>Hesabat</h2>
          <span></span>
        </div>
        <div class="stack">
          <div class="cal-head">
            <button class="icon-btn" data-ryear="-1" aria-label="Əvvəlki il">${chevL}</button>
            <b class="num">${year}</b>
            <button class="icon-btn" data-ryear="1" aria-label="Növbəti il">${chevR}</button>
          </div>
          <div class="seg" style="grid-template-columns:1fr 1fr 1fr">
            <button data-rview="months" aria-pressed="${view === "months"}">Aylar</button>
            <button data-rview="cats" aria-pressed="${view === "cats"}">Xərclər</button>
            <button data-rview="inc" aria-pressed="${view === "inc"}">Gəlirlər</button>
          </div>
          ${body}
          <p class="note">Məbləğlər manatla (₼). Cədvəli sağa-sola sürüşdürə bilərsiniz.</p>
          <button class="primary" data-xlsx ${d.recs.length ? "" : "disabled"}>Excel faylı yüklə (${year})</button>
        </div>`);
      // Cari ilin cədvəlində son aylar görünsün
      const w = document.querySelector(".sheet .tbl-wrap");
      if (w && view !== "months" && year === new Date().getFullYear()) w.scrollLeft = w.scrollWidth;
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.ryear) { year += Number(t.dataset.ryear); draw(); }
      else if (t.dataset.rview) { view = t.dataset.rview; draw(); }
      else if (t.hasAttribute("data-xlsx")) exportXlsx(year, t);
    };
    draw();
  }

  // Faylı istifadəçiyə vermək: claude.ai daxilində təsdiqlə, ayrıca PWA-da birbaşa yükləmə
  async function saveFile(filename, blob) {
    const dl = window.claude?.use ? await window.claude.use("downloads").catch(() => null) : null;
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast("Fayl hazırdır"); }
      catch (e) { if (e?.code !== "declined") toast("Faylı yükləmək alınmadı."); }
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  let xlsxPromise = null;
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return xlsxPromise ||= new Promise((ok, fail) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.onload = () => ok(window.XLSX);
      sc.onerror = () => { xlsxPromise = null; fail(new Error("load")); };
      document.head.appendChild(sc);
    });
  }

  async function exportXlsx(year, btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Hazırlanır…";
    try {
      const XLSX = await loadXlsx();
      const d = reportData(year);
      const wb = XLSX.utils.book_new();
      const add = (name, rows, widths) => {
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = widths.map(w => ({ wch: w }));
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      // 1. Aylar
      const mRows = [["Ay", "Gəlir", "Xərc", "Qalıq", "Ehtiyac", "İstək", "İnvestisiya", "Kredit"]];
      const tot = [0, 0, 0, 0, 0, 0, 0];
      d.months.forEach(m => {
        const vals = [m.inc, m.out, m.inc - m.out, m.need, m.want, m.investment, m.credit].map(r2);
        vals.forEach((v, i) => tot[i] += v);
        mRows.push([`${m.name} ${year}`, ...vals]);
      });
      mRows.push(["Cəmi", ...tot.map(r2)]);
      add("Aylar", mRows, [16, 12, 12, 12, 12, 12, 12, 12]);
      // 2. Xərc maddələri və 3. Gəlirlər (pivot)
      const pivotRows = (rows, label) => {
        const out = [[label, ...MONTHS, "Cəmi"]];
        const totals = Array(13).fill(0);
        rows.forEach(r => { const vals = [...r.arr, r.total].map(r2); vals.forEach((v, i) => totals[i] += v); out.push([r.name, ...vals]); });
        out.push(["Cəmi", ...totals.map(r2)]);
        return out;
      };
      add("Xərc maddələri", pivotRows(d.cats, "Xərc maddəsi"), [22, ...Array(13).fill(11)]);
      add("Gəlirlər", pivotRows(d.incCats, "Gəlir mənbəyi"), [22, ...Array(13).fill(11)]);
      // 4. Bütün əməliyyatlar
      const ops = [["Tarix", "Növ", "Başlıq", "Maddə", "Məbləğ", "Qeyd"]];
      d.recs.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => ops.push([
        r.date.split("-").reverse().join("."), r.kind === "income" ? "Gəlir" : "Xərc",
        r.kind === "income" ? "" : (TYPE[r.type]?.title || ""), catById(r.catId)?.name || "Kateqoriyasız",
        r2(Number(r.amount) || 0), r.note || ""
      ]));
      add("Əməliyyatlar", ops, [12, 8, 12, 22, 12, 30]);

      const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const filename = `Budcem-hesabat-${year}.xlsx`;
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      await saveFile(filename, blob);
    } catch (e) {
      toast("Excel hazırlamaq alınmadı. İnternet bağlantısını yoxlayın.");
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  function summaryView() {
    const list = monthRecords();
    const exp = list.filter(r => r.kind === "expense");
    const inc = sum(list.filter(r => r.kind === "income"));
    const out = sum(exp);
    const bal = inc - out;

    const byType = TYPES.map(t => ({ ...t, total: sum(exp.filter(r => r.type === t.id)) }));
    // Donut: hər başlıq üçün bir qövs
    const R = 52, C = 2 * Math.PI * R;
    let off = 0;
    const arcs = out > 0 ? byType.filter(t => t.total > 0).map(t => {
      const len = t.total / out * C;
      const gap = byType.filter(x => x.total > 0).length > 1 ? 2 : 0;
      const s = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${t.color}" stroke-width="16" stroke-dasharray="${Math.max(len - gap, 0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 66 66)"/>`;
      off += len; return s;
    }).join("") : `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>`;

    const groups = {};
    exp.forEach(r => { const n = catById(r.catId)?.name || "Kateqoriyasız"; groups[n] = (groups[n] || 0) + Number(r.amount); });
    const cats = Object.entries(groups).sort((a, b) => b[1] - a[1]);
    const max = cats[0]?.[1] || 1;

    return `
      <section class="card balance">
        <p class="label">Qalıq</p>
        <div class="big num ${bal < 0 ? "neg" : ""}">${money(bal)}</div>
        <div class="split">
          <div class="in"><small>Gəlir</small><b class="num">${money(inc)}</b></div>
          <div class="out"><small>Xərc</small><b class="num">${money(out)}</b></div>
        </div>
      </section>
      ${toolTiles()}
      <section class="card">
        <p class="label">Xərc başlıqları</p>
        <div class="donut-row">
          <svg class="donut" viewBox="0 0 132 132" role="img" aria-label="Xərc başlıqları üzrə bölgü">
            ${arcs}
            <text x="66" y="62" text-anchor="middle" font-size="11" opacity=".6">Cəmi</text>
            <text x="66" y="80" text-anchor="middle" font-size="15" font-weight="700" class="num">${esc(money(out))}</text>
          </svg>
          <div class="legend">
            ${byType.map(t => `
              <div class="legend-item">
                <span class="dot" style="background:${t.color}"></span>
                <span>${t.title}</span>
                <span class="num">${money(t.total)}<span class="pct">${out > 0 ? Math.round(t.total / out * 100) : 0}%</span></span>
              </div>`).join("")}
          </div>
        </div>
      </section>
      <section class="card">
        <button class="card-toggle" data-togglesum aria-expanded="${state.catsOpen}">
          <p class="label">Xərc maddələri üzrə${cats.length ? ` · ${cats.length}` : ""}</p><span class="chev">›</span>
        </button>
        ${!state.catsOpen ? "" : cats.length ? `<div class="bars">${cats.map(([n, v]) => `
          <div class="bar-row">
            ${badge(n)}
            <div class="name">${esc(n)}<div class="track"><i style="width:${(v / max * 100).toFixed(1)}%"></i></div></div>
            <span class="num">${money(v)}</span>
          </div>`).join("")}</div>`
        : `<div class="empty" style="padding:16px"><b>Bu ay xərc yoxdur</b>Aşağıdakı + düyməsi ilə ilk xərci əlavə edin.</div>`}
      </section>
      ${monthsHtml()}
      ${store.mode === "local" ? `<p class="note">Məlumatlar bu cihazın brauzerində saxlanılır.</p>` : ""}`;
  }

  // Bütün ayların tarixçəsi: köhnə aylar silinmir, istənilən aya qayıtmaq olar
  function monthsHtml() {
    const byMonth = {};
    state.records.forEach(r => {
      if (!r.date) return;
      const k = r.date.slice(0, 7);
      const m = byMonth[k] ||= { inc: 0, out: 0 };
      if (r.kind === "income") m.inc += Number(r.amount) || 0; else m.out += Number(r.amount) || 0;
    });
    const keys = Object.keys(byMonth).sort().reverse();
    if (!keys.length) return "";
    const cur = monthKey(state.month);
    return `<section class="months">
      <p class="label" style="margin-left:4px">Aylar üzrə tarixçə</p>
      <div class="list">${keys.map(k => {
        const [y, m] = k.split("-").map(Number), v = byMonth[k], bal = v.inc - v.out;
        return `<button class="row" data-month="${k}" aria-current="${k === cur}">
          <span class="badge" style="background:var(--accent);color:var(--accent-fg);font-size:12px">${pad(m)}</span>
          <span class="t"><div>${MONTHS[m - 1]} ${y}</div><div class="sub num">Gəlir ${money(v.inc)} · Xərc ${money(v.out)}</div></span>
          <span class="amt num ${bal < 0 ? "bal-neg" : ""}">${money(bal)}</span>
        </button>`;
      }).join("")}</div>
    </section>`;
  }

  // ---------- Xərc planı ----------
  // Plan hər ay üçün eynidir: gözlənilən gəlir, 4 başlıq üzrə limit və istəyə bağlı maddə limitləri
  function planView() {
    const list = monthRecords();
    const exp = list.filter(r => r.kind === "expense");
    const inc = sum(list.filter(r => r.kind === "income"));
    const out = sum(exp);
    const P = state.plan;
    const planOut = TYPES.reduce((a, t) => a + (Number(P.types[t.id]) || 0), 0);
    const left = planOut - out;
    const pct = (v, p) => p > 0 ? Math.min(v / p * 100, 100).toFixed(1) : 0;
    const msg = (v, p) => !p ? `<div class="msg">Limit qoyulmayıb</div>` : v > p
      ? `<div class="msg over">Limit ${money(v - p)} aşılıb</div>`
      : `<div class="msg">Qalan: ${money(p - v)} · ${Math.round(v / p * 100)}%</div>`;
    const row = (attr, icon, name, v, p) => `
      <button class="plan-row" ${attr}>
        ${icon}
        <div>
          <div class="top"><span>${esc(name)}</span><span class="num">${money(v)} <span class="muted">/ ${p ? money(p) : "–"}</span></span></div>
          <div class="prog ${p && v > p ? "over" : ""}"><i style="width:${p ? pct(v, p) : 0}%"></i></div>
          ${msg(v, p)}
        </div>
      </button>`;

    const catSpent = {};
    exp.forEach(r => { if (r.catId) catSpent[r.catId] = (catSpent[r.catId] || 0) + (Number(r.amount) || 0); });
    const expCats = state.categories.filter(c => c.kind === "expense");
    const active = expCats.filter(c => P.cats[c.id] || catSpent[c.id])
      .sort((a, b) => (Number(P.cats[b.id]) || 0) - (Number(P.cats[a.id]) || 0) || (catSpent[b.id] || 0) - (catSpent[a.id] || 0));
    const rest = expCats.filter(c => !active.includes(c));

    return `
      <section class="card">
        <p class="label">${MONTHS[state.month.getMonth()]} planı</p>
        <div class="plan-top">
          <button data-planedit="income"><small>Gəlir planı</small><b class="num">${P.income ? money(P.income) : "Yazın"}</b></button>
          <div><small>Plan xərc</small><b class="num">${money(planOut)}</b></div>
          <div><small>Qənaət planı</small><b class="num ${P.income - planOut < 0 ? "bal-neg" : ""}">${P.income ? money(P.income - planOut) : "–"}</b></div>
        </div>
        <div class="plan-big">
          <b class="num ${planOut && out > planOut ? "bal-neg" : ""}">${money(out)}</b>
          <span class="num">${planOut ? `${money(planOut)} plandan` : "xərclənib"}</span>
        </div>
        <div class="prog ${planOut && out > planOut ? "over" : ""}"><i style="width:${pct(out, planOut)}%"></i></div>
        <p class="note" style="text-align:left;margin:8px 0 0">${!planOut ? "Aşağıda başlıqlara toxunub aylıq limit yazın." : left >= 0 ? `Bu ay hələ ${money(left)} xərcləyə bilərsiniz.` : `Plan ${money(-left)} aşılıb.`}${P.income ? ` Faktiki gəlir: ${money(inc)}.` : ""}</p>
      </section>
      <section class="card" style="padding-block:10px 6px">
        <p class="label" style="margin-top:6px">Başlıqlar üzrə limit</p>
        ${TYPES.map(t => row(`data-planedit="type:${t.id}"`, `<span class="type-ic" style="background:color-mix(in srgb, ${t.color} 15%, transparent)"><i style="background:${t.color}"></i></span>`,
          t.title, sum(exp.filter(r => r.type === t.id)), Number(P.types[t.id]) || 0)).join("")}
      </section>
      <section class="card" style="padding-block:10px 6px">
        <p class="label" style="margin-top:6px">Xərc maddələri üzrə limit</p>
        ${active.map(c => row(`data-planedit="cat:${esc(c.id)}"`, badge(c.name), c.name, catSpent[c.id] || 0, Number(P.cats[c.id]) || 0)).join("")
          || `<p class="note" style="text-align:left;margin:4px 0 10px">İstəsəniz, ayrı-ayrı maddələrə də limit qoya bilərsiniz (məs. Restoran 150 ₼).</p>`}
        ${rest.length ? `<button class="card-toggle" data-planall aria-expanded="${state.planShowAll}" style="padding:10px 0;border-top:1px solid var(--line)">
            <span class="small-link">${state.planShowAll ? "Gizlət" : `Digər maddələr (${rest.length})`}</span><span class="chev">›</span></button>
          ${state.planShowAll ? rest.map(c => row(`data-planedit="cat:${esc(c.id)}"`, badge(c.name), c.name, 0, 0)).join("") : ""}` : ""}
      </section>
      <p class="note">Plan hər ay üçün eynidir. Başlıqların cəmi aylıq ümumi xərc planıdır, maddə limitləri isə əlavə nəzarət üçündür.</p>`;
  }

  function openPlanEdit(target) {
    const P = state.plan;
    let title, current;
    if (target === "income") { title = "Gözlənilən aylıq gəlir"; current = P.income; }
    else if (target.startsWith("type:")) { const t = TYPE[target.slice(5)]; title = `${t.title} limiti`; current = P.types[t.id]; }
    else { const c = catById(target.slice(4)); if (!c) return; title = `${c.name} limiti`; current = P.cats[c.id]; }
    let text = current ? String(current).replace(".", ",") : "";
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Ləğv et</button>
        <h2>${esc(title)}</h2>
        <button class="link save" data-save>Saxla</button>
      </div>
      <div class="stack">
        <label class="amount-wrap"><input id="p-amount" class="num" inputmode="decimal" placeholder="0" value="${esc(text)}" autocomplete="off"><em>₼</em></label>
        <p class="note">${target === "income" ? "Hər ay təxminən nə qədər gəlir gözləyirsiniz?" : "Bu məbləğ hər ay üçün limit olacaq. Boş saxlasanız, limit götürülür."}</p>
        ${current ? `<button class="secondary" data-clear>Limiti götür</button>` : ""}
      </div>`);
    const inp = $("#p-amount");
    inp.addEventListener("input", () => { text = inp.value; });
    setTimeout(() => inp.focus(), 50);
    const apply = v => {
      const np = normPlan(state.plan);
      if (target === "income") np.income = v;
      else if (target.startsWith("type:")) { if (v) np.types[target.slice(5)] = v; else delete np.types[target.slice(5)]; }
      else { if (v) np.cats[target.slice(4)] = v; else delete np.cats[target.slice(4)]; }
      state.plan = np; store.saveMeta(); closeSheet(); toast("Plan yeniləndi");
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-save")) { const v = parseFloat(text.replace(",", ".")); apply(v > 0 ? Math.round(v * 100) / 100 : 0); }
      else if (t.hasAttribute("data-clear")) apply(0);
    };
  }

  function recordsView() {
    let list = monthRecords();
    if (state.filter !== "all") list = list.filter(r => r.kind === state.filter);
    const days = {};
    list.forEach(r => (days[r.date] ||= []).push(r));
    const keys = Object.keys(days).sort().reverse();
    const chips = [["all", "Hamısı"], ["expense", "Xərc"], ["income", "Gəlir"]]
      .map(([k, t]) => `<button class="chip" data-filter="${k}" aria-pressed="${state.filter === k}">${t}</button>`).join("");
    if (!keys.length) return `<div class="chips">${chips}</div><div class="empty"><b>Əməliyyat yoxdur</b>Bu ay üçün hələ heç nə qeyd edilməyib. + düyməsinə toxunun.</div>`;
    return `<div class="chips">${chips}</div>` + keys.map(k => {
      const items = days[k].slice().sort((a, b) => (b.created || 0) - (a.created || 0));
      const net = sum(items.filter(r => r.kind === "income")) - sum(items.filter(r => r.kind === "expense"));
      return `<section class="day" id="d-${k}"><h3><span>${dayTitle(k)}</span><span class="num">${money(net)}</span></h3>
        <div class="list">${items.map(rowHtml).join("")}</div></section>`;
    }).join("");
  }

  function rowHtml(r) {
    const c = catById(r.catId);
    const name = c?.name || "Kateqoriyasız";
    const sub = [r.kind === "income" ? "Gəlir" : TYPE[r.type]?.title, r.note].filter(Boolean).map(esc).join(" · ");
    return `<button class="row" data-edit="${esc(r.id)}">
      ${badge(name)}
      <span class="t"><div>${esc(name)}</div><div class="sub">${sub}</div></span>
      <span class="amt num ${r.kind === "income" ? "in" : ""}">${r.kind === "income" ? "+" : "−"}${money(Number(r.amount))}</span>
    </button>`;
  }

    const counts = {};
    state.records.forEach(r => counts[r.catId] = (counts[r.catId] || 0) + 1);
    return `
      <div class="seg">
        <button data-catkind="expense" aria-pressed="${state.catKind === "expense"}">Xərc maddələri</button>
        <button data-catkind="income" aria-pressed="${state.catKind === "income"}">Gəlir mənbələri</button>
      </div>
      <div class="list">${list.map(c => `
        <button class="row" data-cat="${esc(c.id)}">
          ${badge(c.name)}

          <span class="chev">›</span>
