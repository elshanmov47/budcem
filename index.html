      </div>
      <button class="primary" data-newcat>+ Yeni ${state.catKind === "expense" ? "xərc maddəsi" : "gəlir mənbəyi"}</button>
      ${store.mode === "local" ? `
      <section class="card" style="margin-top:8px">
        <p class="label">Ehtiyat nüsxə</p>
        <p class="note" style="text-align:left;margin:0 0 12px">Məlumatlarınız yalnız bu telefonda saxlanılır. Telefonu dəyişəndə və ya Safari məlumatlarını siləndə itməsin deyə, vaxtaşırı ehtiyat nüsxə yükləyin.</p>
        <div class="split">
          <button class="secondary" data-backup>Nüsxəni yüklə</button>
          <button class="secondary" data-restore>Nüsxədən bərpa et</button>
        </div>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </section>` : ""}`;
  }

  // ---------- Əməliyyat forması ----------
  function openRecordSheet(record, preset, onSaved) {
    const editing = !!record;
    const f = record ? { ...record } : { id: uid(), kind: "expense", type: "need", catId: null, amount: "", date: ymd(new Date()), note: "", created: Date.now(), ...(preset || {}) };
    if (!editing && !preset?.date && monthKey(state.month) !== monthKey(new Date())) {
      // Başqa ay açıqdırsa, həmin ayın 1-i ilə başla
      f.date = ymd(new Date(state.month.getFullYear(), state.month.getMonth(), 1));
    }
    let confirmDel = false, catOpen = false, first = true;

    const draw = () => {
      const cats = state.categories.filter(c => c.kind === f.kind);
      const amt = parseFloat(String(f.amount).replace(",", "."));
      const sel = cats.find(c => c.id === f.catId);
      const ok = amt > 0 && sel && f.date;
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Ləğv et</button>
          <h2>${editing ? "Düzəliş" : "Yeni əməliyyat"}</h2>
          <button class="link save" data-save ${ok ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <div class="seg">
            <button data-kind="expense" aria-pressed="${f.kind === "expense"}">Xərc</button>
            <button data-kind="income" aria-pressed="${f.kind === "income"}">Gəlir</button>
          </div>
          <label class="amount-wrap"><input id="f-amount" class="num" inputmode="decimal" placeholder="0" value="${esc(f.amount)}" autocomplete="off"><em>₼</em></label>
          ${f.kind === "expense" ? `<div class="field"><span>Başlıq</span><div class="types">${TYPES.map(t => `
            <button class="type" style="--c:${t.color}" data-type="${t.id}" aria-pressed="${f.type === t.id}"><span class="dot" style="background:${t.color}"></span>${t.title}</button>`).join("")}</div></div>` : ""}
          <div class="field"><span>${f.kind === "expense" ? "Xərc maddəsi" : "Gəlir mənbəyi"}</span>
            <div class="list">
              <button class="row picker" data-togglecats aria-expanded="${catOpen}">
                ${sel ? badge(sel.name) : `<span class="badge" style="background:var(--surface-2);color:var(--muted)">?</span>`}
                <span class="t"><div class="${sel ? "" : "placeholder"}">${sel ? esc(sel.name) : (f.kind === "expense" ? "Xərc maddəsini seçin" : "Gəlir mənbəyini seçin")}</div></span>
                <span class="chev">›</span>
              </button>
            </div>
            ${catOpen ? `<div class="list picklist">${cats.map(c => `
              <button class="row" data-pick="${esc(c.id)}" aria-pressed="${f.catId === c.id}">
                ${badge(c.name)}<span class="t"><div>${esc(c.name)}</div></span><span class="check">${f.catId === c.id ? "✓" : ""}</span>
              </button>`).join("")}</div>` : ""}
          </div>
          <label class="field"><span>Tarix</span><input id="f-date" class="input" type="date" value="${esc(f.date)}"></label>
          <label class="field"><span>Qeyd</span><input id="f-note" class="input" placeholder="İstəyə bağlı" value="${esc(f.note)}" maxlength="120"></label>
          ${editing ? `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Əməliyyatı sil"}</button>` : ""}
        </div>`);
      const a = $("#f-amount");
      a.addEventListener("input", () => { f.amount = a.value; const v = parseFloat(a.value.replace(",", ".")); $("[data-save]").disabled = !(v > 0 && f.catId && f.date); });
      $("#f-date").addEventListener("change", e => { f.date = e.target.value; });
      $("#f-note").addEventListener("input", e => { f.note = e.target.value; });
      if (first && !editing && !f.amount) setTimeout(() => a.focus(), 50);
      first = false;
    };

    sheetHandler = e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.dataset.kind) { f.kind = t.dataset.kind; f.catId = null; catOpen = false; draw(); }
      else if (t.hasAttribute("data-togglecats")) { catOpen = !catOpen; draw(); }
      else if (t.dataset.type) { f.type = t.dataset.type; draw(); }
      else if (t.dataset.pick) { f.catId = t.dataset.pick; catOpen = false; draw(); }
      else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); }
        else { store.deleteRecord(f.id); closeSheet(); toast("Silindi"); }
      }
      else if (t.hasAttribute("data-save")) {
        const amount = Math.round(parseFloat(String(f.amount).replace(",", ".")) * 100) / 100;
        if (!(amount > 0) || !f.catId || !f.date) return;
        const rec = { id: f.id, kind: f.kind, amount, catId: f.catId, date: f.date, note: (f.note || "").trim(), created: f.created || Date.now() };
        if (f.kind === "expense") rec.type = f.type;
        store.saveRecord(rec);
        onSaved && onSaved(rec);
        const d = parseYmd(rec.date);
        if (monthKey(d) !== monthKey(state.month)) { state.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
        closeSheet(); toast(editing ? "Yeniləndi" : "Əlavə edildi");
      }
    };
    draw();
  }

  // ---------- Kateqoriya forması ----------
  function openCatSheet(cat) {
    const editing = !!cat;
    const f = cat ? { ...cat } : { id: uid().slice(0, 12), name: "", kind: state.catKind };
    let confirmDel = false;
    const used = cat ? state.records.filter(r => r.catId === cat.id).length : 0;
    const draw = () => {
      sheet(`
        <div class="sheet-head">
          <button class="link" data-close>Ləğv et</button>
          <h2>${editing ? "Kateqoriya" : (f.kind === "expense" ? "Yeni xərc maddəsi" : "Yeni gəlir mənbəyi")}</h2>
          <button class="link save" data-save ${f.name.trim() ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <label class="field"><span>Ad</span><input id="c-name" class="input" value="${esc(f.name)}" placeholder="Məsələn: İdman zalı" maxlength="40"></label>
          ${editing ? `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Kateqoriyanı sil"}</button>
          ${used ? `<p class="note">Bu kateqoriyada ${used} əməliyyat var. Silsəniz, onlar "Kateqoriyasız" kimi qalacaq.</p>` : ""}` : ""}
        </div>`);
      const n = $("#c-name");
      n.addEventListener("input", () => { f.name = n.value; $("[data-save]").disabled = !n.value.trim(); });
      if (!editing) setTimeout(() => n.focus(), 50);
    };
    sheetHandler = e => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.hasAttribute("data-save")) {
        const name = f.name.trim(); if (!name) return;
        const cats = state.categories.slice();
        const i = cats.findIndex(c => c.id === f.id);
        if (i >= 0) cats[i] = { ...cats[i], name }; else cats.push({ id: f.id, name, kind: f.kind });
        store.saveCategories(cats); closeSheet(); toast("Yadda saxlanıldı");
      } else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); }
        else { store.saveCategories(state.categories.filter(c => c.id !== f.id)); closeSheet(); toast("Silindi"); }
      }
    };
    draw();
  }

  // ---------- Pəncərə (sheet) və bildiriş ----------
  let sheetHandler = null;
  function sheet(html) {
    const root = $("#sheetRoot");
    root.innerHTML = `<div class="sheet-bg" data-bg><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  }
  // ---------- Xatırladıcı pəncərələri ----------
  function openOccurrenceSheet(key) {
    const [rid, ym] = key.split("|");
    const [yy, mm] = ym.split("-").map(Number);
    const o = occurrences(yy, mm - 1).find(x => x.key === key); if (!o) return;
    const r = o.r, done = o.done, date = o.date;
    sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>${esc(r.title)}</h2>
        <span></span>
      </div>
      <div class="stack">
        <p class="note" style="font-size:15px">${MONTHS[mm - 1]} ${yy} · xatırlatma: ${daysOf(o)}${r.amount ? " · " + money(r.amount) : ""}</p>
        ${done ? `<button class="secondary" data-undo>Ödənilməyib kimi qeyd et</button>` : `
          <button class="primary" data-write>Ödənişi xərc kimi yaz</button>
          <button class="secondary" data-markdone>Sadəcə ödənildi kimi qeyd et</button>`}
        <p class="note">"Xərc kimi yaz" seçsəniz, məbləği daxil edirsiniz, xərc əlavə olunur və xatırladıcı ödənildi kimi işarələnir.</p>
      </div>`);
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-markdone")) { store.setDone(key, true); closeSheet(); toast("Ödənildi kimi qeyd edildi"); }
      else if (t.hasAttribute("data-undo")) {
        const d = { ...state.done };
        Object.keys(d).forEach(k => { if (k === key || k.startsWith(key + "-")) delete d[k]; });
        state.done = d; store.saveMeta(); closeSheet();
      }
      else if (t.hasAttribute("data-write")) {
        const today = ymd(new Date());
        openRecordSheet(null,
          { kind: "expense", type: r.type || "need", catId: r.catId || null, amount: r.amount ? String(r.amount).replace(".", ",") : "", note: r.title, date: date < today ? today : date },
          () => store.setDone(key, true));
      }
    };
  }

  function openRemindersManager() {
    const draw = () => sheet(`
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Xatırladıcılar</h2>
        <span></span>
      </div>
      <div class="stack">
        <div class="list">${state.reminders.map(r => `
          <button class="row" data-editrem="${esc(r.id)}">
            ${badge(r.title)}
            <span class="t"><div>${esc(r.title)}</div><div class="sub">${daysLabel(r.days || [])}${r.amount ? " · " + money(r.amount) : ""}</div></span>
            <span class="chev">›</span>
          </button>`).join("") || `<div class="empty">Hələ xatırladıcı yoxdur.</div>`}
        </div>
        <button class="primary" data-newrem>+ Yeni xatırladıcı</button>
        <p class="note">Telefona bildiriş gəlməsi üçün bu ödənişləri iPhone təqviminə də əlavə edə bilərsiniz.</p>
      </div>`);
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.editrem) openReminderEdit(state.reminders.find(r => r.id === t.dataset.editrem));
      else if (t.hasAttribute("data-newrem")) openReminderEdit(null);
    };
    draw();
  }

  function openReminderEdit(rem) {
    const editing = !!rem;
    const f = rem ? { ...rem, daysText: (rem.days || []).join(", "), amountText: rem.amount ? String(rem.amount).replace(".", ",") : "" }
                  : { id: "r-" + uid().slice(0, 10), title: "", daysText: "", amountText: "", type: "need", catId: "" };
    let confirmDel = false;
    const parseDays = () => [...new Set(f.daysText.split(/[^0-9]+/).map(Number).filter(n => n >= 1 && n <= 31))].sort((a, b) => a - b);
    const valid = () => f.title.trim() && parseDays().length;
    const draw = () => {
      const cats = state.categories.filter(c => c.kind === "expense");
      sheet(`
        <div class="sheet-head">
          <button class="link" data-back>‹ Geri</button>
          <h2>${editing ? "Xatırladıcı" : "Yeni xatırladıcı"}</h2>
          <button class="link save" data-save ${valid() ? "" : "disabled"}>Saxla</button>
        </div>
        <div class="stack">
          <label class="field"><span>Ad</span><input id="r-title" class="input" value="${esc(f.title)}" placeholder="Məsələn: İpoteka" maxlength="40"></label>
          <label class="field"><span>Ayın hansı günləri (vergüllə)</span><input id="r-days" class="input num" inputmode="numeric" value="${esc(f.daysText)}" placeholder="Məsələn: 1, 5"></label>
          <label class="field"><span>Məbləğ (istəyə bağlı)</span><input id="r-amount" class="input num" inputmode="decimal" value="${esc(f.amountText)}" placeholder="0 ₼"></label>
          <div class="field"><span>Başlıq</span><div class="types">${TYPES.map(t => `
            <button class="type" style="--c:${t.color}" data-type="${t.id}" aria-pressed="${f.type === t.id}"><span class="dot" style="background:${t.color}"></span>${t.title}</button>`).join("")}</div></div>
          <label class="field"><span>Xərc maddəsi</span>
            <select id="r-cat" class="input"><option value="">Seçilməyib</option>${cats.map(c => `<option value="${esc(c.id)}" ${c.id === f.catId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
          </label>
          ${editing ? `<button class="danger ${confirmDel ? "confirm" : ""}" data-del>${confirmDel ? "Silməyi təsdiqləyin" : "Xatırladıcını sil"}</button>` : ""}
        </div>`);
      const upd = () => { $("[data-save]").disabled = !valid(); };
      $("#r-title").addEventListener("input", e => { f.title = e.target.value; upd(); });
      $("#r-days").addEventListener("input", e => { f.daysText = e.target.value; upd(); });
      $("#r-amount").addEventListener("input", e => { f.amountText = e.target.value; });
      $("#r-cat").addEventListener("change", e => { f.catId = e.target.value; });
    };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-back")) openRemindersManager();
      else if (t.dataset.type) { f.type = t.dataset.type; draw(); }
      else if (t.hasAttribute("data-del")) {
        if (!confirmDel) { confirmDel = true; draw(); }
        else { store.saveReminders(state.reminders.filter(r => r.id !== f.id)); toast("Silindi"); openRemindersManager(); }
      }
      else if (t.hasAttribute("data-save")) {
        if (!valid()) return;
        const amount = parseFloat(f.amountText.replace(",", "."));
        const item = { id: f.id, title: f.title.trim(), days: parseDays(), type: f.type, catId: f.catId || null, amount: amount > 0 ? Math.round(amount * 100) / 100 : null };
        const list = state.reminders.slice();
        const i = list.findIndex(r => r.id === f.id);
        if (i >= 0) list[i] = item; else list.push(item);
        store.saveReminders(list); toast("Yadda saxlanıldı"); openRemindersManager();
      }
    };
    draw();
  }

  // ---------- Ay seçimi (təqvim) ----------
  function openMonthPicker() {
    let year = state.month.getFullYear();
    let mode = "months", month = state.month.getMonth();
    const has = new Set(state.records.map(r => (r.date || "").slice(0, 7)));
    const now = new Date();
    const chevL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
    const chevR = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>`;
    // Kiçik məbləğ: 1 250, 12k
    const short = v => v >= 10000 ? Math.round(v / 1000) + "k" : String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    const monthsHtml = () => `
      <div class="sheet-head">
        <button class="link" data-close>Bağla</button>
        <h2>Ay seçin</h2>
        <button class="link save" data-today>Bu ay</button>
      </div>
      <div class="stack">
        <div class="cal-head">
          <button class="icon-btn" data-year="-1" aria-label="Əvvəlki il">${chevL}</button>
          <b class="num">${year}</b>
          <button class="icon-btn" data-year="1" aria-label="Növbəti il">${chevR}</button>
        </div>
        <div class="cal-grid">${MONTHS.map((name, i) => {
          const k = `${year}-${pad(i + 1)}`;
          const cls = ["cal-m", has.has(k) ? "has" : "", year === now.getFullYear() && i === now.getMonth() ? "today" : ""].join(" ");
          return `<button class="${cls}" data-pickmonth="${i}" aria-pressed="${k === monthKey(state.month)}">${name}<i></i></button>`;
        }).join("")}</div>
        <p class="note">Nöqtə olan aylarda qeyd edilmiş əməliyyat var.</p>
      </div>`;

    const daysHtml = () => {
      const k = `${year}-${pad(month + 1)}`;
      const spent = {};
      state.records.forEach(r => {
        if (r.kind === "expense" && r.date && r.date.startsWith(k)) spent[r.date] = (spent[r.date] || 0) + (Number(r.amount) || 0);
      });
      const total = Object.values(spent).reduce((a, b) => a + b, 0);
      const remDays = new Set(occurrences(year, month).filter(o => !o.done).flatMap(o => o.dates));
      const first = new Date(year, month, 1);
      const lead = (first.getDay() + 6) % 7; // həftə bazar ertəsindən başlayır
      const count = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < lead; i++) cells.push(`<button class="cal-d" disabled></button>`);
      for (let d = 1; d <= count; d++) {
        const key = `${k}-${pad(d)}`, v = spent[key] || 0;
        const today = key === ymd(now);
        cells.push(`<button class="cal-d ${v ? "spent" : ""} ${today ? "today" : ""} ${remDays.has(key) ? "has-rem" : ""}" data-day="${key}" aria-label="${d} ${MONTHS[month]}${v ? ", " + money(v) + " xərc" : ""}">
          <b class="num">${d}</b>${v ? `<small class="num">${short(v)}</small>` : ""}</button>`);
      }
      return `
        <div class="sheet-head">
          <button class="link" data-back>‹ Aylar</button>
          <h2>Günlər</h2>
          <button class="link save" data-openmonth>Aç</button>
        </div>
        <div class="stack">
          <div class="cal-head">
            <button class="icon-btn" data-mstep="-1" aria-label="Əvvəlki ay">${chevL}</button>
            <b>${MONTHS[month]} ${year}</b>
            <button class="icon-btn" data-mstep="1" aria-label="Növbəti ay">${chevR}</button>
          </div>
          <div>
            <div class="cal-wd"><span>B.e</span><span>Ç.a</span><span>Ç</span><span>C.a</span><span>C</span><span>Ş</span><span>B</span></div>
            <div class="cal-days" style="margin-top:6px">${cells.join("")}</div>
          </div>
          <div class="cal-sum"><span>Ay ərzində xərc</span><b class="num">${money(total)}</b></div>
          <p class="note">Günə toxunsanız, həmin günün əməliyyatları açılır. Narıncı nöqtə: ödəniş xatırladıcısı.</p>
        </div>`;
    };

    const draw = () => sheet(mode === "months" ? monthsHtml() : daysHtml());
    const go = (y, m) => { state.month = new Date(y, m, 1); closeSheet(); render(); };
    sheetHandler = e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.dataset.year) { year += Number(t.dataset.year); draw(); }
      else if (t.dataset.pickmonth) { month = Number(t.dataset.pickmonth); mode = "days"; draw(); }
      else if (t.dataset.mstep) { const d = new Date(year, month + Number(t.dataset.mstep), 1); year = d.getFullYear(); month = d.getMonth(); draw(); }
      else if (t.hasAttribute("data-back")) { mode = "months"; draw(); }
      else if (t.hasAttribute("data-openmonth")) go(year, month);
      else if (t.hasAttribute("data-today")) go(now.getFullYear(), now.getMonth());
      else if (t.dataset.day) {
        const day = t.dataset.day;
        state.tab = "records"; state.filter = "all";
        go(year, month);
        const el = document.getElementById("d-" + day);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        else toast(`${dayTitle(day)}: əməliyyat yoxdur`);
      }
    };
    draw();
  }

  function closeSheet() { $("#sheetRoot").innerHTML = ""; sheetHandler = null; }
  $("#sheetRoot").addEventListener("click", e => {
    if (e.target.hasAttribute("data-bg") || e.target.closest("[data-close]")) return closeSheet();
    sheetHandler && sheetHandler(e);
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  let toastTimer;
  function toast(msg) {
    $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("#toastRoot").innerHTML = ""; }, 2200);
  }

  // ---------- Hadisələr ----------
  document.querySelector(".tabbar").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });
  $("#monthLabel").addEventListener("click", openMonthPicker);
  $("#prevM").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); render(); });
  $("#nextM").addEventListener("click", () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); render(); });
  $("#fab").addEventListener("click", () => state.ready && openRecordSheet(null));
  $("#view").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.filter) { state.filter = b.dataset.filter; render(); }
    else if (b.dataset.occ) openOccurrenceSheet(b.dataset.occ);
    else if (b.hasAttribute("data-openrem")) openRemindersSheet();
    else if (b.hasAttribute("data-report")) openReport();
    else if (b.dataset.planedit) openPlanEdit(b.dataset.planedit);
    else if (b.hasAttribute("data-planall")) { state.planShowAll = !state.planShowAll; render(); }
    else if (b.hasAttribute("data-togglesum")) { state.catsOpen = !state.catsOpen; render(); }
    else if (b.dataset.month) { const [y, m] = b.dataset.month.split("-").map(Number); state.month = new Date(y, m - 1, 1); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (b.dataset.edit) { const r = state.records.find(x => x.id === b.dataset.edit); r && openRecordSheet(r); }
    else if (b.dataset.catkind) { state.catKind = b.dataset.catkind; render(); }
    else if (b.dataset.cat) { const c = catById(b.dataset.cat); c && openCatSheet(c); }
    else if (b.hasAttribute("data-newcat")) openCatSheet(null);
    else if (b.hasAttribute("data-backup")) {
      const data = { app: "budcem", version: 1, saved: new Date().toISOString(), categories: state.categories, records: state.records, reminders: state.reminders, done: state.done, plan: state.plan };
      saveFile(`Budcem-nusxe-${ymd(new Date())}.json`, new Blob([JSON.stringify(data)], { type: "application/json" }));
    }
    else if (b.hasAttribute("data-restore")) $("#restoreFile").click();
  });

  // Ehtiyat nüsxədən bərpa (yalnız telefonda saxlanılan rejimdə)
  document.addEventListener("change", e => {
    if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (d.app !== "budcem" || !Array.isArray(d.records)) throw new Error("format");
        state.categories = d.categories || DEFAULT_CATS.slice();
        state.records = d.records;
        state.reminders = d.reminders || [];
        state.done = d.done || {};
        state.plan = normPlan(d.plan);
        store.persistLocal(); render();
        toast(`Bərpa edildi: ${d.records.length} əməliyyat`);
      } catch (err) { toast("Bu fayl Büdcəm ehtiyat nüsxəsi deyil."); }
    };
    reader.readAsText(e.target.files[0]);
    e.target.value = "";
  });

  render();
  store.init();

  // ---------- Görünüş (açıq / tünd rejim) ----------
  // Açarla seçilən rejim bu cihazda yadda qalır; seçim edilməyibsə, telefonun ayarı istifadə olunur
  const MODE_KEY = "budcem.mode";
  const sysDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  function getMode() { try { return localStorage.getItem(MODE_KEY); } catch (e) { return null; } }
  function isDark() {
    const m = getMode();
    if (m === "dark" || m === "light") return m === "dark";
    const host = document.documentElement.getAttribute("data-theme");
    if (host === "dark" || host === "light") return host === "dark";
    return !!sysDark?.matches;
  }
  function applyMode() {
    const m = getMode();
    if (m === "dark" || m === "light") document.documentElement.setAttribute("data-mode", m);
    else document.documentElement.removeAttribute("data-mode");
    $("#themeBtn").setAttribute("aria-checked", String(isDark()));
  }
  applyMode();
  sysDark?.addEventListener?.("change", applyMode);
  $("#themeBtn").addEventListener("click", () => {
    try { localStorage.setItem(MODE_KEY, isDark() ? "light" : "dark"); } catch (e) {}
    applyMode();
  });

  // Ayrıca PWA kimi açılanda oflayn işləmək üçün
  if ("serviceWorker" in navigator && location.protocol === "https:" && !window.claude) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>

</body>
</html>
